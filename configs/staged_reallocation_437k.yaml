# Mechanistic parameter-reallocation experiment.
#
# Learned parameter budget:
#   ARB:               436,882
#   wider baseline:    437,166 (+284, a conservative control)
#
# Fact information load:
#   80,000 balanced 512-way associations * log2(512) = 720,000 bits
#   720,000 / 436,882 = 1.648 target bits per learned ARB parameter.
#
# Phase A forces both mixed models to learn all four arithmetic operations.
# Phase B resets AdamW, introduces capacity-pressure facts, and continues
# arithmetic rehearsal. The baseline therefore cannot obtain a high fact score
# merely by abandoning arithmetic without that tradeoff appearing in its curve.
model:
  n_layer: 2
  n_embd: 96
  n_head: 4
  n_inner: 384
  baseline_n_inner: 423

data:
  dataset_file: "pretraining_data/staged_reallocation_437k.pt"
  tokenizer_file: "pretraining_data/staged_reallocation_437k_tokenizer.json"
  tokenizer_vocab_size: 2048
  fact_count: 80000
  fact_key_vocab_size: 512
  fact_value_vocab_size: 512
  # Retain addition, subtraction, multiplication, and exact division. Two
  # operand digits remain nontrivial while allowing the tiny baseline to learn
  # a meaningful arithmetic circuit during the dedicated first phase.
  max_digits: 2
  arithmetic_pool_size: 25000
  arithmetic_eval_cases: 4000

training:
  output_dir: "pretraining_runs/staged_reallocation_437k_seed20260830"
  device: "auto"
  seed: 20260830
  model_seed: 20260830
  context_length: 16
  batch_size: 512

  # Phase B contains 384 facts and 128 arithmetic examples per step.
  fact_batch_fraction: 0.75
  max_steps: 20000

  # Phase A: 4.096M arithmetic presentations, about 164 per pool item.
  arithmetic_pretrain_steps: 8000
  arithmetic_pretrain_eval_every: 1000
  reset_optimizer_after_arithmetic_pretrain: true

  # Phase B: 7.68M fact presentations (96/fact) and 2.56M arithmetic
  # rehearsals (102/pool item). Loss weights match these task proportions.
  learning_rate: 0.0003
  weight_decay: 0.01
  fact_loss_weight: 0.75
  arithmetic_loss_weight: 0.25
  log_every: 25
  eval_every: 1000
  curve_eval_cases: 4096
  save_checkpoints: true
