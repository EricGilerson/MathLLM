# Extended 40K-fact calibration for the 437K-parameter model.
#
# The 10K-step run reached 28.1% fact accuracy while its loss and accuracy were
# still improving rapidly. This run holds the task and model fixed and doubles
# optimization to 20K steps (192 presentations per fact) to measure the actual
# fact-only ceiling before running either mixed condition.
model:
  n_layer: 2
  n_embd: 96
  n_head: 4
  n_inner: 384
  baseline_n_inner: 423

data:
  # A separate schedule file is required because schedules contain one row per
  # training step. Separate artifacts also preserve the completed 10K run.
  dataset_file: "pretraining_data/staged_reallocation_437k_40k_20k.pt"
  tokenizer_file: "pretraining_data/staged_reallocation_437k_40k_20k_tokenizer.json"
  tokenizer_vocab_size: 2048
  fact_count: 40000
  fact_key_vocab_size: 512
  fact_value_vocab_size: 512
  max_digits: 2
  arithmetic_pool_size: 25000
  arithmetic_eval_cases: 4000

training:
  output_dir: "pretraining_runs/staged_reallocation_437k_40k_20k_seed20260830"
  device: "auto"
  seed: 20260830
  model_seed: 20260830
  context_length: 16
  batch_size: 512

  # Each step contains 384 facts and 128 arithmetic examples. Across 20K
  # steps, each fact is presented exactly 192 times on average.
  fact_batch_fraction: 0.75
  max_steps: 20000

  # Used only by mixed conditions after the fact-only ceiling is established.
  arithmetic_pretrain_steps: 8000
  arithmetic_pretrain_eval_every: 1000
  reset_optimizer_after_arithmetic_pretrain: true

  learning_rate: 0.0003
  weight_decay: 0.01
  fact_loss_weight: 0.75
  arithmetic_loss_weight: 0.25
  log_every: 25
  eval_every: 1000
  curve_eval_cases: 4096
  save_checkpoints: true
