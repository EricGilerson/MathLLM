# CUDA-scale Priority 3 protocol. Run baseline and ARB separately for at least
# three seeds; this file deliberately does not reuse any fine-tuned checkpoint.
# The baseline's slightly wider MLP matches the ARB interface parameter count.
model:
  n_layer: 6
  n_embd: 512
  n_head: 8
  n_inner: 2048
  baseline_n_inner: 2059

data:
  mixture_file: "pretraining_data/toy_full_20m_75_15_10.pt"
  tokenizer_file: "pretraining_data/toy_full_20m_75_15_10_tokenizer.json"
  tokenizer_vocab_size: 2048
  prose_documents: 20000
  train_blocks: 200000
  eval_blocks: 5000
  # Exact fixed-length block mix: 75% prose, 15% canonical equations, and
  # 10% instruction-prefixed equations. The two equation sources are distinct.
  arithmetic_token_fraction: 0.25  # legacy aggregate, retained for compatibility
  direct_equation_token_fraction: 0.15
  contextual_equation_token_fraction: 0.10
  max_digits: 3
  invocation_fraction: 0.0

training:
  output_dir: "pretraining_runs/toy_full_20m_75_15_10_seed20260723"
  device: "auto"
  seed: 20260723
  context_length: 128
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.01
  max_steps: 50000
  eval_batches: 32
  eval_cases: 100
