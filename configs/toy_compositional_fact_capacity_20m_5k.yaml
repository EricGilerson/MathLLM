# Fixed-vocabulary parameter-capacity probe.  A fact is an arbitrary mapping
# from a two-token key to a one-token value.  128 key fragments yield 16,384
# possible identities, while the 512-value label bank and 2,048-token
# vocabulary stay fixed: increasing fact count does not add one embedding row
# per fact.
model:
  n_layer: 6
  n_embd: 512
  n_head: 8
  n_inner: 2048
  baseline_n_inner: 2059

data:
  mixture_file: "pretraining_data/toy_compositional_fact_capacity_20m_5k.pt"
  tokenizer_file: "pretraining_data/toy_compositional_fact_capacity_20m_5k_tokenizer.json"
  tokenizer_vocab_size: 2048
  prose_documents: 50000
  prose_source: "fineweb_edu"
  prose_source_config: "sample-10BT"
  train_blocks: 200000
  eval_blocks: 1000
  # 50% prose, 25% direct arithmetic, 5% contextual equations, 20% mappings.
  arithmetic_token_fraction: 0.30
  direct_equation_token_fraction: 0.25
  contextual_equation_token_fraction: 0.05
  fact_token_fraction: 0.20
  fact_count: 5000
  fact_format: "compositional"
  fact_key_vocab_size: 128
  fact_value_vocab_size: 512
  max_digits: 3
  require_external_prose: true
  require_unique_source_blocks: true

training:
  output_dir: "pretraining_runs/toy_compositional_fact_capacity_20m_5k_seed20260801"
  device: "auto"
  seed: 20260801
  context_length: 128
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.01
  max_steps: 25000
  log_every: 25
  eval_batches: 32
  eval_cases: 100
