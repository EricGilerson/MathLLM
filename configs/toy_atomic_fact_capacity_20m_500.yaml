# Clean parameter-capacity probe.  Each arbitrary entity and value is a
# tokenizer special token, so the task is exactly: predict one stored value
# token from a fixed two-token query prefix.  This replaces the earlier
# free-form natural-language fact probe, whose multi-token answers mixed
# storage with surface-form generation.
model:
  n_layer: 6
  n_embd: 512
  n_head: 8
  n_inner: 2048
  baseline_n_inner: 2059

data:
  mixture_file: "pretraining_data/toy_atomic_fact_capacity_20m_500.pt"
  tokenizer_file: "pretraining_data/toy_atomic_fact_capacity_20m_500_tokenizer.json"
  tokenizer_vocab_size: 2048
  prose_documents: 50000
  prose_source: "fineweb_edu"
  prose_source_config: "sample-10BT"
  train_blocks: 200000
  eval_blocks: 1000
  # Matched full-LM objective: 50% prose, 25% direct equations, 5%
  # contextual equations, and 20% opaque key-value associations.
  arithmetic_token_fraction: 0.30
  direct_equation_token_fraction: 0.25
  contextual_equation_token_fraction: 0.05
  fact_token_fraction: 0.20
  fact_count: 500
  fact_format: "atomic"
  max_digits: 3
  require_external_prose: true
  require_unique_source_blocks: true

training:
  output_dir: "pretraining_runs/toy_atomic_fact_capacity_20m_500_seed20260731"
  device: "auto"
  seed: 20260731
  context_length: 128
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.01
  max_steps: 25000
  log_every: 25
  eval_batches: 32
  eval_cases: 100
