# Calibrated mechanistic parameter-reallocation experiment.
#
# Learned parameter budget:
#   ARB:               436,882
#   wider baseline:    437,166 (+284, a conservative control)
#
# Fact information load:
#   40,000 balanced 512-way associations * log2(512) = 360,000 bits
#   360,000 / 436,882 = 0.824 target bits per learned ARB parameter.
#
# This is the first calibration point after the 80K-fact condition proved too
# difficult for the 437K model at the available optimization budget. Run the
# fact-only condition first. Only run the mixed pair if the fact-only ceiling
# is informative (roughly 70-95% accuracy).
model:
  n_layer: 2
  n_embd: 96
  n_head: 4
  n_inner: 384
  baseline_n_inner: 423

data:
  # Separate artifacts prevent this calibration from overwriting the 80K run.
  dataset_file: "pretraining_data/staged_reallocation_437k_40k.pt"
  tokenizer_file: "pretraining_data/staged_reallocation_437k_40k_tokenizer.json"
  tokenizer_vocab_size: 2048
  fact_count: 40000
  fact_key_vocab_size: 512
  fact_value_vocab_size: 512
  # Keep all four operations, including the harder multiplication and exact
  # division cases, so the arithmetic burden remains substantive.
  max_digits: 2
  arithmetic_pool_size: 25000
  arithmetic_eval_cases: 4000

training:
  output_dir: "pretraining_runs/staged_reallocation_437k_40k_seed20260830"
  device: "auto"
  seed: 20260830
  model_seed: 20260830
  context_length: 16
  batch_size: 512

  # Phase B contains 384 facts and 128 arithmetic examples per step.
  fact_batch_fraction: 0.75
  max_steps: 10000

  # Phase A is unchanged: 4.096M arithmetic presentations, about 164 per
  # arithmetic-pool item. It is skipped automatically for fact_only.
  arithmetic_pretrain_steps: 8000
  arithmetic_pretrain_eval_every: 1000
  reset_optimizer_after_arithmetic_pretrain: true

  # Phase B gives 3.84M fact presentations, preserving the 96 presentations
  # per fact used by the 80K run. Mixed conditions also receive 1.28M
  # arithmetic rehearsals, about 51 per pool item.
  learning_rate: 0.0003
  weight_decay: 0.01
  fact_loss_weight: 0.75
  arithmetic_loss_weight: 0.25
  log_every: 25
  eval_every: 1000
  curve_eval_cases: 4096
  save_checkpoints: true
